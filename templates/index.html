<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Spam Detector</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 650px;
            background: white;
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.10);
        }
        h1 { margin-top: 0; margin-bottom: 8px; }
        p { color: #666; }
        textarea {
            width: 100%;
            min-height: 150px;
            padding: 14px;
            border: 1px solid #d5d9de;
            border-radius: 12px;
            resize: vertical;
            font-size: 16px;
            outline: none;
        }
        button {
            margin-top: 14px;
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        .result {
            margin-top: 18px;
            padding: 16px;
            border-radius: 12px;
            background: #f4f6f8;
            display: none;
        }
        .label { font-size: 24px; font-weight: 700; }
        .small { margin-top: 6px; color: #666; }
    </style>
</head>
<body>
    <div class="card">
        <h1>SMS Spam Detector</h1>
        <p>Enter an SMS message and the trained TF-IDF + Logistic Regression model will classify it.</p>

        <textarea id="message" placeholder="Example: Congratulations! You won a free prize..."></textarea>
        <button onclick="predict()">Check Message</button>

        <div class="result" id="result">
            <div class="label" id="label"></div>
            <div class="small" id="probability"></div>
        </div>
    </div>

    <script>
        async function predict() {
            const message = document.getElementById("message").value.trim();
            const result = document.getElementById("result");
            const label = document.getElementById("label");
            const probability = document.getElementById("probability");

            if (!message) {
                alert("Please enter a message.");
                return;
            }

            const response = await fetch("/predict", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({message})
            });

            const data = await response.json();
            result.style.display = "block";

            if (!response.ok) {
                label.textContent = data.error || "Something went wrong.";
                probability.textContent = "";
                return;
            }

            label.textContent = data.prediction;
            probability.textContent =
                "Spam probability: " + data.spam_probability + "%";
        }
    </script>
</body>
</html>
